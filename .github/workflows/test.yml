name: Test plugin

on:
  push:
    branches: ["main", "plugin-management"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: python -m pip install packaging
      - name: Validate manifest
        shell: python
        run: |
          import json
          from pathlib import Path
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version
          data = json.loads(Path("plugin.json").read_text(encoding="utf-8"))
          assert data["id"] == "ocr"
          assert data["api_version"] == 1
          assert data["requires"] == ["processing"]
          assert data["execution"] == "in_process"
          assert data["route_prefix"] is None
          assert data["rpc_api_version"] is None
          assert data["rpc_permissions"] == []
          assert data["python_requires"] == [{
              "requirement": "rapidocr-onnxruntime>=1.2",
              "import": "rapidocr_onnxruntime",
              "label": "RapidOCR",
              "optional": False,
          }]
          assert SpecifierSet(data["app_requires"]).contains(Version("0.2.0.dev0"), prereleases=True)
      - name: Check Python syntax
        run: python -m compileall -q __init__.py plugin.py compat.py engine.py errors.py services.py worker.py scripts/build_registry_artifact.py
      - name: Check plugin boundaries
        shell: bash
        run: |
          if grep -REn 'from \.\.(\.|[A-Za-z_])' --include='*.py' . --exclude-dir=.git; then
            echo "External plugin must use fuckclassroom.* for host imports" >&2
            exit 1
          fi
          if grep -REn '(^|[[:space:]])(from|import)[[:space:]].*(processing|ai_summary)' --include='*.py' . --exclude-dir=.git; then
            echo "OCR must not import processing/AI Summary implementations" >&2
            exit 1
          fi
          if grep -REn 'fuckclassroom\.plugins\.ocr\.' --include='*.py' . --exclude-dir=.git; then
            echo "OCR Worker must load local package modules" >&2
            exit 1
          fi
      - name: Smoke-build Registry v1 artifact
        run: |
          python scripts/build_registry_artifact.py 0.1.0-ci.0
          sha256sum -c ocr-0.1.0-ci.0.zip.sha256
